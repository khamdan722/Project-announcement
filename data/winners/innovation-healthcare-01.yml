name_en: "HAYAT: Transforming Organ Donation and Transplantation through Digital Innovation"

# نبذة عن الفائز — English, 250–400 words: lay-language description of the project: what it changed, how it was built, measured results
bio_en: |
  HAYAT is a UAE-wide initiative that integrates organ donation and transplantation through coordinated
  governance, standardised clinical pathways, digital systems, and collaboration among healthcare
  providers and authorities across the Emirates. Implementing a unified national programme across
  organisations at different levels of digital maturity was recognised by the jury as a substantial
  undertaking.

  The programme has raised the deceased-donor rate to nearly 14 per million population and gathered more
  than 35,000 donor pledges. It is supported by digital dashboards, workforce development, quality
  assurance, regulatory progress and international collaboration, and extends to interventions not
  covered by insurance, in the interest of equitable access.

  The jury recorded HAYAT's significance within the UAE and the wider MENA region, alongside its
  attention to ethical considerations and to the cybersecurity of its digital platform, and its potential
  for further development including the use of artificial intelligence to improve operational efficiency.
  It scored 98 out of 100 at interview stage and 94.67 in the first round, the strongest overall
  performance in the award.

# Documents this write-up was built from (CV, nomination form, paper, abstract).
# Every factual claim in bio_en must be traceable to one of these.
bio_ar: |
  «حياة» مبادرة على مستوى دولة الإمارات العربية المتحدة تُعنى بتكامل منظومة التبرع بالأعضاء وزراعتها، عبر
  حوكمة منسّقة ومسارات سريرية موحّدة وأنظمة رقمية وتعاون بين مقدّمي الرعاية الصحية والجهات المعنية في
  مختلف الإمارات. وقد اعتبرت لجنة التحكيم أنّ تطبيق برنامج وطني موحّد عبر مؤسسات تتفاوت في مستوى نضجها
  الرقمي يمثّل إنجازاً كبيراً.

  ورفع البرنامج معدّل التبرع من المتوفين إلى نحو 14 متبرعاً لكل مليون نسمة، وجمع أكثر من 35 ألف تعهّد
  بالتبرع. ويستند إلى لوحات بيانات رقمية وتطوير للكوادر وضمان للجودة وتقدّم تنظيمي وتعاون دولي، ويشمل
  تدخّلات غير مشمولة بالتأمين بما يخدم عدالة الوصول إلى الرعاية.

  وسجّلت اللجنة أهمية «حياة» داخل دولة الإمارات وفي منطقة الشرق الأوسط وشمال أفريقيا، إلى جانب عنايته
  بالاعتبارات الأخلاقية وبأمن المعلومات في منصّته الرقمية، وإمكانات تطويره مستقبلاً بما في ذلك توظيف
  الذكاء الاصطناعي لتحسين الكفاءة التشغيلية. وقد نال 98 من 100 في مرحلة المقابلات و94.67 في المرحلة
  الأولى، وهو أعلى أداء في الجائزة.

