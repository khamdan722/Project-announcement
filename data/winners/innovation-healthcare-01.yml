name_en: "HAYAT: Transforming Organ Donation and Transplantation through Digital Innovation"
notes_en: >-
  Ministry of Health and Prevention — HAYAT, the UAE National Program for Organ and Tissue Donation and Transplantation.

# نبذة عن الفائز — English, 250–400 words: lay-language description of the project: what it changed, how it was built, measured results
bio_en: |
  HAYAT is the UAE National Program for Organ and Tissue Donation and Transplantation, established under the
  Ministry of Health and Prevention and implemented with federal and local health authorities, hospitals,
  transplant centres, laboratories and community partners. It turned organ donation and transplantation from
  a fragmented service into a nationally coordinated, patient-centred system.

  Its central achievement is the HAYAT National Organ Donation and Transplant Coordination Ecosystem, the
  first model of its kind in the region, which brings governance, legislation, clinical pathways,
  operational processes, information exchange, quality management and public engagement into a single
  national framework. Rather than concentrating on transplantation activity alone, the programme redesigned
  the whole pathway, aligning donor hospitals, transplant centres, histocompatibility laboratories,
  regulators and community partners through standardised clinical pathways and transparent allocation.

  The programme has raised the deceased-donor rate to nearly 14 per million population and gathered more
  than 35,000 donor pledges, supported by digital dashboards, workforce development, quality assurance and
  international collaboration. It extends to interventions not covered by insurance, in the interest of
  equitable access.

# Documents this write-up was built from (CV, nomination form, paper, abstract).
# Every factual claim in bio_en must be traceable to one of these.
bio_ar: |
  «حياة» هو البرنامج الوطني للتبرع بالأعضاء والأنسجة وزراعتها في دولة الإمارات العربية المتحدة، أُنشئ
  برعاية وزارة الصحة ووقاية المجتمع ونُفّذ بالتعاون مع الجهات الصحية الاتحادية والمحلية والمستشفيات ومراكز
  الزراعة والمختبرات وشركاء المجتمع. وقد حوّل التبرع بالأعضاء وزراعتها من خدمة مجزّأة إلى منظومة وطنية
  منسّقة محورها المريض.

  وأبرز إنجازاته منظومة «حياة» الوطنية لتنسيق التبرع بالأعضاء وزراعتها، وهي الأولى من نوعها في المنطقة، إذ
  تجمع الحوكمة والتشريعات والمسارات السريرية والعمليات التشغيلية وتبادل المعلومات وإدارة الجودة والتواصل
  المجتمعي في إطار وطني واحد. وبدل الاكتفاء بنشاط الزراعة، أعاد البرنامج تصميم المسار بأكمله، فواءم بين
  مستشفيات المتبرعين ومراكز الزراعة ومختبرات التوافق النسيجي والجهات التنظيمية وشركاء المجتمع عبر مسارات
  سريرية موحّدة وآليات تخصيص شفافة.

  ورفع البرنامج معدّل التبرع من المتوفين إلى نحو 14 متبرعاً لكل مليون نسمة، وجمع أكثر من 35 ألف تعهّد
  بالتبرع، مستنداً إلى لوحات بيانات رقمية وتطوير للكوادر وضمان للجودة وتعاون دولي. ويشمل تدخّلات غير
  مشمولة بالتأمين بما يخدم عدالة الوصول إلى الرعاية.

