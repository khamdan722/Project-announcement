name_en: "From Vision to Reality: Building a Burn Center of Excellence in the UAE"
notes_en: >-
  Burn Division, Sheikh Shakhbout Medical City, Abu Dhabi.

# نبذة عن الفائز — English, 250–400 words: lay-language description of the project: what it changed, how it was built, measured results
bio_en: |
  The Burn Center of Excellence at Sheikh Shakhbout Medical City is Abu Dhabi's first, built around the goal
  of American Burn Association accreditation and a multidisciplinary model of specialised burn care for the
  UAE and the wider region.

  The centre brought care together under one roof: advanced temporary skin substitutes, clinical pathways
  aligned to ABA standards, specialised rehabilitation, psychosocial support, and reimbursement and
  charitable pathways for the long-term care burn survivors need. Traditional pathways were re-engineered
  around real-time quality dashboards, and staffing was rebuilt as a cross-trained workforce able to deliver
  high-acuity burn care, intensive rehabilitation and psychosocial support together. International
  collaborations brought simulation-based training designed for the particular demands of burn injury, and
  the centre helped establish Abu Dhabi's first coordinated burn referral network.

  Patient numbers have grown by approximately 40 percent, with a mortality rate of 1.4 percent in 2025 and
  1.3 percent for January to August 2026, and 95 percent of patients discharged home. A partnership with
  Ma'an supports treatment for people without insurance. American Burn Association verification is planned
  for 2027.

# Documents this write-up was built from (CV, nomination form, paper, abstract).
# Every factual claim in bio_en must be traceable to one of these.
bio_ar: |
  مركز التميّز لعلاج الحروق في مدينة الشيخ شخبوط الطبية هو الأول في أبوظبي، وقد أُسّس حول هدف نيل اعتماد
  الجمعية الأمريكية للحروق، وحول نموذج متعدد التخصصات للرعاية التخصصية بالحروق في دولة الإمارات والمنطقة.

  وجمع المركز الرعاية تحت سقف واحد: بدائل الجلد المؤقتة المتقدمة، ومسارات سريرية موائمة لمعايير الجمعية
  الأمريكية للحروق، وإعادة تأهيل تخصصية، ودعم نفسي واجتماعي، ومسارات للتغطية المالية والدعم الخيري تلبّي
  حاجة الناجين من الحروق إلى رعاية طويلة الأمد. وأُعيدت هندسة المسارات التقليدية حول لوحات بيانات آنية
  للجودة، وأُعيد بناء ملاك الموظفين ليكون فريقاً متعدد المهارات قادراً على الجمع بين رعاية الحروق الحرجة
  وإعادة التأهيل المكثّف والدعم النفسي والاجتماعي. وأتاحت شراكات دولية برامج تدريب قائمة على المحاكاة
  مصمّمة لمتطلبات إصابات الحروق، كما أسهم المركز في إنشاء أول شبكة منسّقة لإحالة حالات الحروق في أبوظبي.

  وارتفع عدد المرضى بنحو 40 بالمئة، وسجّل المركز معدّل وفيات بلغ 1.4 بالمئة في عام 2025 و1.3 بالمئة في
  الفترة من يناير إلى أغسطس 2026، مع خروج 95 بالمئة من المرضى إلى منازلهم. وتدعم شراكة مع مؤسسة «معاً»
  علاج غير المؤمَّن عليهم. ومن المقرر نيل اعتماد الجمعية الأمريكية للحروق في عام 2027.

