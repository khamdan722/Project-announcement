# نبذة عن الفائز
bio_en: |
  Dr. Khalid A. Fakhro has spent his career building the field of genomics in the Arab world, and much of
  what exists in Qatar today was established under his hand. He graduated top of his country in 2001 and
  chose genetics at a time when the discipline was widely seen as offering little career prospect in the
  Gulf. He completed his undergraduate studies at the University of Chicago, his master's and doctorate at
  Yale University on full scholarships, and post-doctoral training at Weill Cornell Medicine, where he
  watched the Yale Genome Center take shape and recognised what next-generation sequencing would one day
  mean for patients in his own region.

  He returned to a country whose genomic research infrastructure was, in his own description, rudimentary.
  With a small team he spent years building the foundations — recruiting physicians, identifying families,
  and establishing sequencing and computational pipelines from scratch. By late 2016 more than 2,000
  individuals had been sequenced, producing discoveries that drew global attention to Arab genomics. Among
  them were the identification of an indigenous founder Arab population descended from the earliest human
  migrations out of Africa, which reached the cover of Genome Research; the first high-resolution mapping
  of population structure across the Gulf; and the first assessment of how reference bias distorts genome
  interpretation for Arab patients, showing that a substantial share of so-called variant alleles are in
  fact the norm in Qataris, including roughly 200 wrongly catalogued as disease-causing.

  In 2014 he was appointed lead consultant to the Qatar Genome Program, the region's first national
  sequencing programme, and authored the strategy that established a national sequencing capability. As
  inaugural Director of Human Genetics and now Chief Research Officer at Sidra Medicine, he launched
  Qatar's first point-of-care whole genome sequencing service for children with rare disease, reaching a
  diagnostic rate of around 60 percent where conventional testing had failed, and established the region's
  largest autism bio-resource.

  Open data has been a principle throughout: his teams have contributed more than 1,000 Qatari exomes and
  genomes to the public domain, the largest Arab genome submission of its kind. He has built the training
  pathways to sustain the field, including accredited graduate programmes in genetic counselling and in
  genomics and precision medicine, ensuring the next generation of Arab geneticists is trained at home.

