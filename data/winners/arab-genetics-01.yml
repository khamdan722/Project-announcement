# نبذة عن الفائز
bio_en: |
  Dr. Khalid A. Fakhro graduated top of his country in 2001 and chose genetics, a discipline then
  perceived as offering limited career prospects in the GCC. He took his BA at the University of Chicago and
  his master's and PhD at Yale University on full scholarships, then trained at Weill Cornell Medicine.

  He returned to Qatar, where local genomic research infrastructure was, in his own words, rudimentary.
  With a small team he had sequenced more than 2,000 individuals by late 2016. Their discoveries included
  an indigenous founder Arab population descended from the earliest human migrations out of Africa,
  featured on the February 2016 cover of Genome Research, and the first study of reference bias in Arab
  patients, which found nearly 15 percent of "variant alleles" should be considered reference in Qataris,
  around 200 of them mis-labelled as pathogenic in OMIM.

  Appointed lead consultant to the Qatar Genome Program in 2014 and inaugural Director of Human Genetics
  at Sidra Medicine in 2016, he established Qatar's first point-of-care whole genome sequencing programme,
  which reached a diagnostic rate of around 60 percent, and the region's largest bio-resource for autism.
  His teams have contributed more than 1,000 Qatari exomes and genomes to the public domain — the largest
  Arab genome submission to a public database to date.

