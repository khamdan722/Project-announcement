# الاسم — العنوان العربي للبحث الفائز
name_ar: "بروتين pHERV-W ENV في الحويصلات خارج الخلوية كمؤشر حيوي ديناميكي للتنبؤ بالانتكاسات وتقييم مآل مرض التصلب المتعدد."

# الملاحظات — الفريق البحثي والجهة التابع لها
notes_ar: "فريق بحثي من الجامعة الأمريكية في بيروت – مركز نعمة وتريز طعمة للتصلب المتعدد (لبنان)."

# نبذة عن الفائز
bio_en: |
  The envelope protein of human endogenous retrovirus type W, pHERV-W ENV, has been implicated in the
  pathogenesis of multiple sclerosis, but its clinical utility as a biomarker remained incompletely
  defined. The study found it enriched on serum-derived exosomes in patients with relapsing-remitting
  MS, where it reflects both current disease activity and future risk.

  The team measured exosomal pHERV-W ENV across three groups: one comparing healthy people with stable and with
  active disease; one following patients before, during and after episodes of activity; and one tracking
  newly diagnosed patients over three years.

  Levels rose during active disease and declined at follow-up. They correlated with Epstein-Barr virus
  LMP2A expression, and monocytes and B cells were the predominant sources of the circulating protein.
  Patients with high levels at baseline recorded more total disease activity — clinical relapses together
  with new or enlarging MRI lesions — over three years, and lost "No Evidence of Disease Activity" status
  sooner.

  The findings suggest that exosomal pHERV-W ENV may serve as a dynamic, non-invasive biomarker of
  disease activity with prognostic value in multiple sclerosis.

# نبذة عن الفائز — النسخة العربية
bio_ar: |
  يُعدّ البروتين الغلافي للفيروس القهقري الداخلي المنشأ من النوع W، المعروف اختصاراً بـ pHERV-W ENV، من
  العوامل المرتبطة بآلية نشوء التصلب المتعدد، غير أنّ فائدته السريرية كمؤشر حيوي لم تكن محددة بوضوح. وقد
  وجدت الدراسة أنّ هذا البروتين يتركّز على الحويصلات خارج الخلوية (الإكسوسومات) المستخلصة من مصل الدم
  لدى المصابين بالتصلب المتعدد متكرر الانتكاس والخمود، وأنّه يعكس نشاط المرض الحالي واحتمالات تطوّره مستقبلاً.

  وقاس الفريق البحثي مستويات هذا البروتين لدى ثلاث مجموعات: مجموعة قارنّا فيها أشخاصاً أصحّاء بمرضى مستقرّين وآخرين في
  طور نشاط المرض؛ ومجموعة جرت متابعتها قبل نوبات النشاط وأثناءها وبعدها؛ ومجموعة من المرضى حديثي
  التشخيص جرت متابعتهم على مدى ثلاث سنوات.

  ارتفعت المستويات خلال نشاط المرض ثم تراجعت عند المتابعة، وارتبطت بتعبير بروتين LMP2A المشتق من فيروس
  إبشتاين-بار، وتبيّن أنّ الخلايا الوحيدة والخلايا البائية هي المصدر الأساسي للبروتين في الدورة الدموية.
  أمّا المرضى الذين سجّلوا مستويات مرتفعة عند خط الأساس فقد شهدوا نشاطاً مرضياً أكبر — انتكاسات سريرية
  وآفات جديدة أو متوسّعة في التصوير بالرنين المغناطيسي — على مدى ثلاث سنوات، وفقدوا حالة «انعدام الدليل
  على نشاط المرض» في وقت أبكر.

  وتشير النتائج إلى أنّ هذا البروتين قد يصلح مؤشراً حيوياً ديناميكياً غير جراحي لنشاط التصلب المتعدد، ذا
  قيمة في التنبؤ بمسار المرض.

