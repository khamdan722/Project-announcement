bio_ar: |
  تقرأ الفحوص الجينية المعتمدة في الفحص قبل الزواج الحمض النووي في أجزاء قصيرة جداً. وينجح ذلك في معظم
  الجينوم، غير أنّه يخفق على نحو متكرر في المناطق التي تتشابه فيها الجينات تشابهاً شديداً، ومنها الجينات
  المسؤولة عن الثلاسيميا وضمور العضلات الشوكي وفرط التنسّج الكظري الخلقي. وهذه تحديداً أكثر الحالات صلة
  بالفئات عالية الخطورة، ما يعني إغفال بعض الحاملين تماماً.

  طوّرت هذه الدراسة نمطاً جديداً من الفحص باستخدام تقنية التسلسل بالقراءات الطويلة من «أكسفورد نانوبور»،
  التي تقرأ مقاطع أطول بكثير من الحمض النووي دفعة واحدة، مقترنةً بأسلوب أخذ العيّنات التكيّفي الذي يقرّر
  فيه جهاز التسلسل آنياً أيّ المقاطع يقرأ وأيّها يستبعد، بما يتيح التركيز على 836 جيناً ذات صلة بالأمراض
  الوراثية دون أي خطوة إغناء كيميائية.

  وقد بُني الفحص وجرى تحسينه واختباره على 75 شخصاً لديهم متغيّرات جينية مؤكّدة سابقاً تشمل فئات مرضية
  متعددة، فكشف جميع أنواع المتغيّرات — الطفرات الصغيرة وإعادات الترتيب البنيوية والحذوف الكبيرة — بدقة
  كاملة، وحلّ مناطق جينية معقّدة تعجز عنها الفحوص المعتادة، ضمن مسار عمل واحد يُغني عن الفحوص التكميلية
  المنفصلة التي تستلزمها الممارسة السريرية اليوم.

  والنتيجة أداة فحص أسرع وأشمل قابلة للتوسّع على مستوى السكان، وقادرة على تقليص عدد الأزواج المعرّضين
  للخطر الذين تغفلهم برامج الفحص قبل الزواج.

