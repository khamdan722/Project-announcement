name_en: "Development of an Adaptive Sampling-Based Long-Read Sequencing Assay for Premarital Genetic Screening"
notes_en: >-
  Khulood Alblooshi — Mohammed Bin Rashid University of Medicine and Health Sciences; Genetics Medical Laboratory Technologist, Sheikh Khalifa Medical City.

# نبذة عن الفائز — English, 250–400 words: lay-language summary of the paper, written the way the researchers would describe it ("In our study, we aimed to…")
bio_en: |
  Standard genetic tests used in premarital screening read DNA in very short fragments. That works for most
  of the genome, but it fails consistently in regions where genes look almost identical to one another —
  among them the genes behind thalassemia, spinal muscular atrophy and congenital adrenal hyperplasia. Those
  are precisely the conditions most relevant to high-risk populations, so some carriers are missed entirely.

  This study developed a new form of testing using Oxford Nanopore long-read sequencing, which reads much
  longer stretches of DNA at once. It was combined with adaptive sampling, by which the sequencing machine
  decides in real time which fragments to read and which to discard, allowing it to focus on the 836 genes
  relevant to inherited disease without any physical enrichment step.

  The assay was built, optimised and tested on 75 individuals with previously confirmed genetic variants
  across several disease categories. It detected every variant type — small mutations, structural
  rearrangements and large deletions — with complete accuracy, and resolved complex gene regions that
  routinely defeat standard tests, in a single workflow that removes the need for the separate follow-up
  tests clinical practice currently requires.

  The result is a faster and more comprehensive screening tool that can be scaled to a population, and that
  could reduce the number of at-risk couples missed by premarital screening programmes.

