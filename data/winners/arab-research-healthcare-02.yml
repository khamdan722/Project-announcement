# الاسم — العنوان العربي للبحث الفائز
name_ar: "مرجع أولي للجينوم الشامل (البانجينوم) العربي من دولة الإمارات العربية المتحدة."

# الملاحظات — الفريق البحثي والجهة التابع لها
notes_ar: "فريق بحثي من مركز علم الجينوم التطبيقي والانتقالي – جامعة محمد بن راشد للطب والعلوم الصحية، دبي الصحية."

# نبذة عن الفائز
bio_en: |
  Global DNA references have historically underrepresented Arab populations. This study built the first
  Arab Pangenome Reference, from high-quality long-read sequencing of 53 people of diverse Arab
  backgrounds in the UAE. Every stage, from sequencing to advanced bioinformatics, was completed in-house
  at the Center for Applied and Translational Genomics at Mohammed Bin Rashid University of Medicine and
  Health Sciences, Dubai Health.

  The reference uncovered over 110 million base pairs of novel DNA sequence, nearly nine million small
  differences and more than 235,000 larger structural differences specific to Arab populations, none of
  them previously reported. One notable discovery was the duplicated gene TAF11L5, highly enriched in the
  individuals studied but absent from global references; it may play a role in regulating other genes,
  with implications for disease risk and individual variation in treatment response.

  The project also produced PanScan, a tool that detects gene duplications, novel DNA changes and complex
  DNA structures, now publicly available on GitHub. Published in Nature Communications, the reference
  enables population-specific biomarkers, risk models and therapeutic targets, and supports the UAE's
  National Genome Strategy.

# نبذة عن الفائز — النسخة العربية
bio_ar: |
  لطالما أغفلت المراجع الجينومية العالمية المعتمدة تمثيل الشعوب العربية. وقد بنت هذه الدراسة أول مرجع
  جينومي عربي شامل، اعتماداً على تسلسل الحمض النووي عالي الجودة بتقنية القراءات الطويلة لـ53 شخصاً من
  خلفيات عربية متنوّعة في دولة الإمارات. وأُجريت جميع مراحل البحث داخل مركز علم الجينوم التطبيقي والانتقالي
  في جامعة محمد بن راشد للطب والعلوم الصحية، ذراع التعلّم والاكتشاف في «دبي الصحية»، بدءاً من التسلسل
  الجيني ووصولاً إلى تحليلات المعلوماتية الحيوية المتقدمة.

  وكشف المرجع عن أكثر من 110 ملايين زوج قاعدي من تسلسلات الحمض النووي لم تكن موثّقة من قبل، وقرابة تسعة
  ملايين متغيّر جيني صغير، وأكثر من 235 ألف متغيّر هيكلي كبير خاص بالشعوب العربية لم يسبق تسجيلها. ومن
  أبرز الاكتشافات الجين المكرّر (TAF11L5) الذي ظهر بكثافة لدى المشاركين العرب بينما لم يُسجّل وجوده في
  المراجع الجينومية العالمية، والذي قد يؤدي دوراً في تنظيم الجينات الأخرى، بما ينعكس على فهم المخاطر
  الصحية واستجابة الأفراد للعلاجات.

  كما أنتج المشروع أداة PanScan التي ترصد تكرارات الجينات والتغيّرات الجديدة في الحمض النووي والتراكيب
  الجينومية المعقّدة، وهي متاحة للباحثين على منصة GitHub. وقد نُشر المرجع في مجلة «نيتشر كوميونيكيشنز»،
  وهو يمكّن من تطوير المؤشرات الحيوية الخاصة بالسكان ونماذج المخاطر والأهداف العلاجية، ويدعم الاستراتيجية
  الوطنية للجينوم في دولة الإمارات.

