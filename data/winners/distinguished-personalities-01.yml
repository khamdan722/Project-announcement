# نبذة عن الفائز
bio_en: |
  Dr. Abubaker Abdul Rahman Shaffi Al Madani is Consultant Neurologist and Head of the Department of
  Neurology at Rashid Hospital, and Professor of Neurology at Mohammed Bin Rashid University of Medicine
  and Health Sciences. Leading that department since 2011, he has built the largest neurology service in
  the United Arab Emirates, caring for more than 20,000 patients each year across Rashid, Dubai and Latifa
  Hospitals.

  Under his leadership the department took its stroke programme to German Stroke Society accreditation,
  gained accreditation as a MENACTRIMS multiple sclerosis centre, and commissioned the 18-bed Neurology
  and Stroke Unit inaugurated in 2019. It maintains registries in multiple sclerosis, dementia,
  neuropathy, headache, movement disorders and epilepsy, alongside specialised clinics in neuromuscular
  medicine, botulinum toxin therapy and deep-brain-stimulation programming.

  He founded Dubai Health's multidisciplinary headache service, extending specialist care to Al Barsha and
  Nad Al Hamar primary health centres; specialist-referral uptake rose from approximately five percent to
  nearly fifty, with patient satisfaction of 80 to 90 percent.

  Core faculty of the hospital's neurology residency programme and Vice President of the Emirates
  Neurology Society, he has authored more than 40 peer-reviewed publications and contributed to the UAE's
  first national multiple sclerosis treatment guidelines, now in the DHA's Ejadah Programme, and to the
  UAE Alzheimer's disease national framework.

# نبذة عن الفائز — النسخة العربية
bio_ar: |
  الدكتور أبوبكر عبدالرحمن شافي المدني استشاري أمراض المخ والأعصاب ورئيس قسم طب الأعصاب بمستشفى راشد،
  وأستاذ طب الأعصاب بجامعة محمد بن راشد للطب والعلوم الصحية. وبقيادته للقسم منذ عام 2011، بنى أكبر خدمة
  لطب الأعصاب في دولة الإمارات العربية المتحدة، تُعنى بأكثر من 20 ألف مريض سنوياً عبر مستشفيات راشد ودبي
  ولطيفة.

  وتحت قيادته حصل برنامج السكتة الدماغية في القسم على اعتماد الجمعية الألمانية للسكتة الدماغية، ونال
  المستشفى اعتماده مركزاً للتصلب المتعدد من منظمة MENACTRIMS، كما جرى تشغيل وحدة طب الأعصاب والسكتة
  الدماغية بسعة 18 سريراً التي افتُتحت عام 2019. ويحتفظ القسم بسجلات مرضية في التصلب المتعدد والخرف
  واعتلال الأعصاب والصداع واضطرابات الحركة والصرع، إلى جانب عيادات متخصصة في الطب العصبي العضلي والعلاج
  بتوكسين البوتولينوم وبرمجة التحفيز العميق للدماغ.

  وقد أسّس خدمة الصداع متعددة التخصصات في «دبي الصحية»، وأوصلها إلى مركزي البرشاء ونَد الحمر للرعاية
  الصحية الأولية؛ فارتفعت نسبة الإحالة إلى الاختصاصيين من نحو خمسة بالمئة إلى ما يقارب خمسين بالمئة،
  برضا المرضى بين 80 و90 بالمئة.

  وهو عضو في الهيئة التدريسية الأساسية لبرنامج الإقامة في طب الأعصاب بمستشفى راشد، ونائب رئيس جمعية
  الإمارات لطب الأعصاب، وله أكثر من 40 بحثاً محكّماً، وأسهم في أول إرشادات علاجية وطنية للتصلب المتعدد في
  دولة الإمارات — المعتمدة اليوم ضمن برنامج «إجادة» بهيئة الصحة بدبي — وفي الإطار الوطني لمرض الزهايمر في
  الدولة.

