# نبذة عن الفائز
bio_en: |
  Professor Humaid Obaid Al-Shamsi is CEO of Burjeel Cancer Institute and President of the Emirates
  Oncology Society, with more than 20 years of experience as a consultant oncologist. Since joining
  Burjeel Holdings in September 2020 he has led the establishment of the UAE's largest comprehensive
  cancer network, with centres in Abu Dhabi, Sharjah, Al Ain and Al Ruwais, bringing specialised services
  closer to patients' homes. He provides free consultations to uninsured cancer patients and works with
  charitable organisations so that support reaches patients wherever they are treated.

  He secured the first and only ESMO accreditation for a UAE cancer centre, and established the nation's
  foremost comprehensive bone marrow transplant unit, which has completed 160 transplants, more than 50 of
  them free of charge to international patients from 20 nationalities — accomplished during the peak of
  the COVID-19 pandemic, when international travel was restricted.

  He contributed to the national rollout of advanced oncology care standards in 2024, to the UAE's
  National Guideline for Lung Cancer Screening and Diagnosis, and to the National Multidisciplinary
  Committee for Cancer Case Assessment established under Ministerial Decree No. 20 of 2025. He founded the
  first hematology and oncology fellowship programme in the UAE's history and is Visiting Professor at
  Harvard Medical School. In February 2025 he received the Sheikha Fatima bint Mubarak Program for
  Excellence and Community Intelligence Award in the Distinguished Personality category, presented by
  His Highness Sheikh Mohamed bin Zayed Al Nahyan, President of the UAE.

# نبذة عن الفائز — النسخة العربية
bio_ar: |
  الأستاذ الدكتور حميد عبيد بن حرمل الشامسي هو الرئيس التنفيذي لمعهد برجيل للأورام ورئيس جمعية الإمارات
  للأورام، وله أكثر من 20 عاماً من الخبرة استشارياً في الأورام. ومنذ التحاقه بمجموعة برجيل القابضة في
  سبتمبر 2020 قاد تأسيس أكبر شبكة متكاملة لرعاية مرضى السرطان في دولة الإمارات، بمراكز في أبوظبي والشارقة
  والعين والرويس، بما قرّب الخدمات التخصصية من منازل المرضى. وهو يقدّم استشارات مجانية لمرضى السرطان غير
  المؤمَّن عليهم، ويعمل مع الجمعيات الخيرية ليصل الدعم إلى المرضى أينما تلقّوا علاجهم.

  وقد حصل على أول وحيد اعتماد من الجمعية الأوروبية لطب الأورام (ESMO) لمركز سرطان في دولة الإمارات، وأسّس
  أبرز وحدة متكاملة لزراعة نخاع العظم في الدولة، التي أجرت 160 عملية زراعة، أكثر من 50 منها مجاناً لمرضى
  دوليين من 20 جنسية، وتحقّق ذلك في ذروة جائحة كوفيد-19 حين كان السفر الدولي مقيّداً.

  وأسهم في التطبيق الوطني لمعايير الرعاية المتقدمة للأورام عام 2024، وفي الدليل الوطني للكشف المبكر عن
  سرطان الرئة وتشخيصه في الدولة، وفي اللجنة الوطنية متعددة التخصصات لتقييم حالات السرطان المُنشأة بموجب
  القرار الوزاري رقم (20) لعام 2025. كما أسّس أول برنامج زمالة في أمراض الدم والأورام في تاريخ الدولة، وهو
  بروفيسور زائر في كلية الطب بجامعة هارفارد. وفي فبراير 2025 نال جائزة برنامج سمو الشيخة فاطمة بنت مبارك
  للتميز والذكاء المجتمعي في فئة الشخصية المتميزة، وقد سلّمها له صاحب السمو الشيخ محمد بن زايد آل نهيان،
  رئيس الدولة.

